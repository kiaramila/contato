<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiara Mila | Jornalista de Automobilismo & Colunista</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Cartão de visitas oficial de Kiara Mila. Jornalista de automobilismo, colunista do #PapoDeGrid, cobertura de F1 e novos patrocínios.">
    <meta name="keywords" content="Kiara Mila, Jornalista de Automobilismo, Fórmula 1, F1, Papo de Grid, Creator, Mídia Kit">
    <meta name="author" content="Kiara Mila">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Kiara Mila | Jornalista de Automobilismo">
    <meta property="og:description" content="Análises de pista, colunas e cobertura de automobilismo.">
    
    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "mainEntity": {
        "@type": "Person",
        "name": "Kiara Mila",
        "jobTitle": "Motorsport Journalist",
        "sameAs": [
          "https://edestaquebrasilia.com.br/papodegrid",
          "https://instagram.com/kiaramila"
        ]
      }
    }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Painel translúcido ajustado para maior transparência e visualização do vídeo */
        .main-glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Garantir cobertura de tela cheia absoluta para o fundo */
        .bg-video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            object-fit: cover;
            pointer-events: none;
        }
        @media (min-aspect-ratio: 16/9) {
            .bg-video-container iframe {
                height: 56.25vw;
            }
        }
        @media (max-aspect-ratio: 16/9) {
            .bg-video-container iframe {
                width: 177.78vh;
            }
        }
    </style>
</head>
<body class="h-full bg-black text-gray-900 antialiased overflow-x-hidden relative selection:bg-red-600 selection:text-white">

    <!-- Fundo com Vídeo do Streamable em Tela Cheia Forçada -->
    <div class="fixed inset-0 w-full h-full overflow-hidden z-0 pointer-events-none bg-black bg-video-container">
        <iframe 
            src="https://streamable.com/e/kfbpf4?autoplay=1&muted=1&controls=0&loop=1" 
            style="border:0;" 
            allow="autoplay; fullscreen" 
            title="F1 Background Video">
        </iframe>
        <!-- Máscara leve sobre o vídeo para garantir leitura -->
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
    </div>

    <!-- Container Principal da Landing Page -->
    <main class="relative z-10 flex flex-col items-center justify-center min-h-full px-4 py-12 sm:py-16">
        <div class="w-full max-w-md mx-auto flex flex-col items-center main-glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl">

            <!-- Bloco de Perfil / Foto Redonda no Topo -->
            <header class="text-center mb-6 w-full flex flex-col items-center">
                <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-white/80 shadow-lg mb-3 flex items-center justify-center bg-gray-200">
                    <img src="https://i.ibb.co/0jCSnPqB/841844883-18628214461025815-5348061339646913044-n.jpg" alt="Kiara Mila" class="w-full h-full object-cover">
                </div>

                <!-- Nome -->
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight drop-shadow-sm">
                    Kiara Mila
                </h1>

                <!-- Subtítulo em Linha Única -->
                <p class="text-[11px] sm:text-xs font-semibold text-gray-800 tracking-wider uppercase mt-1 drop-shadow whitespace-nowrap">
                    Jornalista & Motorsport Content Creator
                </p>
            </header>

            <!-- Lista de Botões Estratégicos (Exatamente 3 Botões) -->
            <nav class="w-full flex flex-col space-y-3">

                <!-- 1. Instagram -->
                <a href="https://instagram.com/kiaramila" target="_blank" rel="noopener noreferrer" class="group relative flex items-center justify-between w-full p-3.5 rounded-2xl bg-white/70 backdrop-blur-md border border-white/60 shadow-md hover:bg-white hover:scale-[1.02] hover:shadow-xl transition-all duration-300">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-9 h-9 rounded-xl bg-pink-500/10 flex items-center justify-center text-pink-600 group-hover:bg-pink-600 group-hover:text-white transition-all duration-300">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect width="20" height="20" x="2" y="2" rx="5" ry="5" stroke-width="2"/>
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke-width="2"/>
                                <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="text-left">
                            <span class="block font-semibold text-gray-900 text-sm tracking-tight">Instagram</span>
                            <span class="block text-[11px] text-gray-600 font-medium">@kiaramila • Bastidores do Paddock</span>
                        </div>
                    </div>
                    <div class="text-gray-400 group-hover:text-pink-600 group-hover:translate-x-1 transition-all duration-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>

                <!-- 2. Coluna #PapoDeGrid -->
                <a href="https://edestaquebrasilia.com.br/papodegrid" target="_blank" rel="noopener noreferrer" class="group relative flex items-center justify-between w-full p-3.5 rounded-2xl bg-white/70 backdrop-blur-md border border-white/60 shadow-md hover:bg-white hover:scale-[1.02] hover:shadow-xl transition-all duration-300">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-9 h-9 rounded-xl bg-red-500/10 flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-colors duration-300">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                            </svg>
                        </div>
                        <div class="text-left">
                            <span class="block font-semibold text-gray-900 text-sm tracking-tight">Coluna #PapoDeGrid</span>
                            <span class="block text-[11px] text-gray-600 font-medium">Artigos e análises de pista</span>
                        </div>
                    </div>
                    <div class="text-gray-400 group-hover:text-red-600 group-hover:translate-x-1 transition-all duration-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>

                <!-- 3. Contato -->
                <button onclick="openModal()" class="group relative flex items-center justify-between w-full p-3.5 rounded-2xl bg-white/70 backdrop-blur-md border border-red-500/30 shadow-md hover:bg-white hover:scale-[1.02] hover:shadow-xl hover:border-red-600 transition-all duration-300 cursor-pointer">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-9 h-9 rounded-xl bg-red-600/10 flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-colors duration-300">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="text-left">
                            <span class="block font-semibold text-gray-900 text-sm tracking-tight">Contato</span>
                            <span class="block text-[11px] text-gray-600 font-medium">Assessoria, pautas e parcerias</span>
                        </div>
                    </div>
                    <div class="text-gray-400 group-hover:text-red-600 group-hover:translate-x-1 transition-all duration-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </button>

            </nav>

            <!-- Rodapé com a Logo KM. Reduzida e Suavizada -->
            <footer class="mt-6 text-center">
                <div class="inline-flex items-center font-semibold tracking-[-0.1em] text-gray-800 text-base">
                    <span>KM</span><span class="text-red-600 font-bold ml-px">.</span>
                </div>
            </footer>

        </div>
    </main>

    <!-- Modal de Contato (Com e-mail direto funcional) -->
    <div id="contact-modal" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/20 transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900">Contato Comercial</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <p class="text-xs text-gray-600 mb-5">
                Para propostas de patrocínio, pautas jornalísticas, cobertura de eventos e assessoria de imprensa:
            </p>
            <div class="space-y-3">
                <a href="mailto:kiaramila@gmail.com?subject=Contato%20Comercial%20/%20Imprensa%20-%20Kiara%20Mila" class="flex items-center justify-center space-x-2 w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-lg shadow-red-600/25">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span>kiaramila@gmail.com</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts de Controle do Modal -->
    <script>
        const modal = document.getElementById('contact-modal');
        const modalContent = document.getElementById('modal-content');

        function openModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
